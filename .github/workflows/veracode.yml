name: "[FEATURE] Veracode SAST + Auto Fix"

on:
  push:
    branches:
      - "feature/**"

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      ###########################################################
      # Checkout
      ###########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ###########################################################
      # Java
      ###########################################################

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      ###########################################################
      # Build
      ###########################################################

      - name: Build Application
        working-directory: app
        run: |
          mvn -B clean package -DskipTests

      ###########################################################
      # Package
      ###########################################################

      - name: Package Source
        run: |
          zip -r veracode-scan-target.zip . \
            -x ".git/*" \
            -x "**/target/*"

      ###########################################################
      # Download Pipeline Scan
      ###########################################################

      - name: Download Pipeline Scan
        run: |
          curl -fsSLO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip

      ###########################################################
      # Run Veracode Pipeline Scan
      ###########################################################

      - name: Run Pipeline Scan
        continue-on-error: true
        run: |
          java -jar pipeline-scan.jar \
            --veracode_api_id "${{ secrets.VERACODE_API_ID }}" \
            --veracode_api_key "${{ secrets.VERACODE_API_KEY }}" \
            --file veracode-scan-target.zip \
            --fail_on_severity="Very High,High"

      ###########################################################
      # Upload Results
      ###########################################################

      - name: Upload Pipeline Results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            results.json
            filtered_results.json
          if-no-files-found: ignore

      ###########################################################
      # Convert to SARIF
      ###########################################################

      - name: Convert to SARIF
        uses: veracode/veracode-pipeline-scan-results-to-sarif@ff08ae5b45d5384cb4679932f184c013d34da9be
        with:
          pipeline-results-json: results.json

      ###########################################################
      # Upload SARIF
      ###########################################################

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: veracode-results.sarif

      ###########################################################
      # Execute Veracode Fix
      ###########################################################

      - name: Execute Veracode Fix
        id: veracode_fix
        continue-on-error: true
        uses: Veracode/veracode-fix@main
        with:
          inputFile: filtered_results.json
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          fixType: single
          prComment: true

      ###########################################################
      # Check for changes
      ###########################################################

      - name: Check Changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      ###########################################################
      # Create Pull Request
      ###########################################################

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: automatic fixes generated by Veracode Fix"
          branch: veracode-fix/${{ github.run_number }}
          delete-branch: true
          title: "Veracode Automatic Fixes"
          body: |
            ## Automated Pull Request

            This Pull Request was automatically generated by Veracode Fix.

            ### Included

            - SAST Scan
            - AI Generated Fixes
            - GitHub Code Scanning (SARIF)

            Please review the generated changes before merging.

          labels: |
            security
            veracode
            automated
